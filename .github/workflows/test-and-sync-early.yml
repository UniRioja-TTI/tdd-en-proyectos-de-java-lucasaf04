name: Test and Sync Early

on:
  push:
    branches:
      - main

jobs:
  test-and-update-early:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necesario para poder hacer merge a otra rama

      # Paso 2: Configurar Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin

      # Paso 3: Ejecutar tests con Maven
      - name: Run tests
        run: mvn test

      # Paso 4: Merge main en early si los tests pasan
      - name: Update early branch
        if: success()  # Solo si los tests pasaron
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Traer la rama early
          git fetch origin early:early
          git checkout early

          # Hacer merge de main
          git merge origin/main --no-edit

          # Subir cambios a early
          git push origin early
